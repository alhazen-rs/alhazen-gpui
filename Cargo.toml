[package]
name = "alhazen-gpui"
description = "Video player for GPUI apps, built on the alhazen-core media engine"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/alhazen-rs/alhazen-gpui"
homepage = "https://github.com/alhazen-rs"
documentation = "https://docs.rs/alhazen-gpui"
readme = "README.md"
keywords = ["gpui", "video", "player", "media", "audio"]
categories = ["multimedia::video", "gui"]
include = ["src/**", "examples/**", "LICENSE", "NOTICE", "README.md"]

[features]
default = ["native", "http", "audio-output", "ffmpeg-cli", "media-foundation", "nvdec", "native-aac"]
native = ["alhazen-core/native"]
http = ["alhazen-core/http"]
# Sound through the system's default device (Linux builds need libasound2-dev).
audio-output = ["alhazen-core/audio-output"]
# AAC-LC, HE-AAC and HE-AACv2 in pure Rust (rusty_aac, Apache-2.0); see alhazen-core's `native-aac`.
native-aac = ["alhazen-core/native-aac"]
# The user's own `ffmpeg` program, found at runtime (nothing is linked).
ffmpeg-cli = ["alhazen-core/ffmpeg-cli"]
# Windows' own (GPU) decoders: H.264, HEVC, VP9, AV1, AAC, MP3, AC-3, E-AC-3, ALAC. No-op elsewhere.
media-foundation = ["alhazen-core/media-foundation"]
# NVIDIA GPU decoding on Linux (NVDEC): H.264, HEVC, VP8, VP9, AV1. Loaded from the driver at
# runtime; nothing on other platforms.
nvdec = ["alhazen-core/nvdec"]

[dependencies]
alhazen-core = { version = "0.4", default-features = false }
gpui = "0.2.2"
# Must match the `image` major version gpui uses (RenderImage is built from image::Frame).
image = { version = "0.25.1", default-features = false }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

# Decoders are unusably slow unoptimized, so they are optimized even in debug builds.
[profile.dev.package.rav1d]
opt-level = 3

[profile.dev.package.vp9-mt]
opt-level = 3
