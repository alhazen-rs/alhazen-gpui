[package]
name = "gpui-video"
description = "Video player element for GPUI, built on video-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["native", "http", "audio-output", "ffmpeg-cli"]
native = ["video-core/native"]
http = ["video-core/http"]
# Sound through the system's default device (Linux builds need libasound2-dev).
audio-output = ["video-core/audio-output"]
# AAC-LC via Symphonia (MPL-2.0); see video-core's `native-aac`.
native-aac = ["video-core/native-aac"]
# The user's own `ffmpeg` program, found at runtime (nothing is linked).
ffmpeg-cli = ["video-core/ffmpeg-cli"]

[dependencies]
video-core.workspace = true
gpui = "0.2.2"
# Must match the `image` major version gpui uses (RenderImage is built from image::Frame).
image = { version = "0.25.1", default-features = false }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
